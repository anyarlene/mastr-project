[project]
name = "mastr-data-pipeline"
version = "0.1.0"
description = "MaStR extract, transform, and load package"
authors = [
    {name = "Any-Arlene Niyubahwe",email = "61238244+anyarlene@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12.8,<3.13"
dependencies = [
    "google-cloud-storage (>=2.19.0,<4.0.0)",
    "google-cloud-bigquery (>=3.25.0,<4.0.0)",
]

[project.scripts]
mastr-ingest = "mastr_data_pipeline.__main__:main"

[dependency-groups]
dev = [
    "pytest (>=8.0)",
    "black (>=24.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = ["optional: not required, nor saved in test_output.txt"]
