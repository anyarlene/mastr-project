[project]
name = "mastr-dashboard"
version = "0.1.0"
description = "Streamlit visualization for MaStR capacity in Potsdam-Mittelmark"
authors = [
    {name = "Any-Arlene Niyubahwe", email = "61238244+anyarlene@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    "google-cloud-bigquery>=3.25.0",
    "db-dtypes>=1.3.0",
    "pyarrow>=17.0.0",
    "altair>=5.4.0",
    "pydeck>=0.9.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
