[project]
name = "mastr-airflow"
version = "0.1.0"
description = "MaStR Airflow orchestration (no business logic)"
authors = [
    {name = "Any-Arlene Niyubahwe", email = "61238244+anyarlene@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12.8,<3.13"
dependencies = [
    "apache-airflow (>=2.10.4,<3.0)",
    "psycopg2-binary (>=2.9.10,<3.0)",
    "apache-airflow-providers-postgres (>=5.14.0,<6.0)",
    "pendulum (>=3.0.0,<4.0)",
]

[dependency-groups]
dev = [
    "pytest (>=8.0)",
    "pyyaml (>=6.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
markers = ["optional: not required, nor saved in test_output.txt"]
