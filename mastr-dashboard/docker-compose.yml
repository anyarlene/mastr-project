services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp_adc.json
    volumes:
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS:?Set GOOGLE_APPLICATION_CREDENTIALS in .env}
        target: /run/secrets/gcp_adc.json
        read_only: true
    restart: unless-stopped
